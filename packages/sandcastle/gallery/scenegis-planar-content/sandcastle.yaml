title: SceneGIS Planar Content
description: >-
  Demonstrates all 16 supported automatic Entity Graphics plus direct ordinary
  and Ground Primitive use in an EPSG:3857 planar Viewer. Grouped views compare
  absolute, anchor-relative, and actual-cover continuous-ground behavior while
  preserving original Entity selection and bounded dynamic/batch controls.
  OpenStreetMap imagery and the public elevation service are best-effort and
  subject to their CORS, availability, attribution, and usage policies. The
  demo requests only current-view tiles and never prefetches, bulk downloads,
  or prepares offline data; cached ancestors or the flat fallback remain usable
  when services fail. Sources: https://operations.osmfoundation.org/policies/tiles/
  and https://developers.arcgis.com/documentation/tiled-elevation-service/
labels:
  - SceneGIS
  - Data Sources
  - Viewer
development: false
