<style>
  @import url(../templates/bucket.css);
</style>
<div id="cesiumContainer" class="fullSize"></div>
<div id="loadingOverlay"><h1>Loading...</h1></div>
<div id="toolbar">
  <button id="contentView" type="button">Content view</button>
  <button id="solidView" type="button">Solid / Area</button>
  <button id="routeView" type="button">Route / Path</button>
  <button id="directView" type="button">Ground / Direct</button>
  <button id="homeView" type="button">Home</button>
  <label><input id="dynamicToggle" type="checkbox" /> Finite dynamic run</label>
  <button id="addBatch" type="button">Add 32-Point batch</button>
  <button id="removeBatch" type="button">Remove batch</button>
  <span id="contentStatus"
    >Sixteen automatic Graphics and direct public primitives use meter-based
    fixed planar coordinates. Imagery and terrain are best-effort; click content
    to inspect Entity metadata. 3D Tiles and classification are not
    supported.</span
  >
</div>
