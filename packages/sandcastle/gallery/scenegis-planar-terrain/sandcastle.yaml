title: SceneGIS Planar Terrain
description: >-
  Combines an EPSG:3857 planar Viewer, explicit OpenStreetMap imagery, and an
  application-configured generic LERC heightmap provider, stable directional
  smooth terrain lighting with geometric-normal flat fallback, caller-owned
  contour, absolute-height, slope, and north-clockwise aspect Material styles,
  and explicit
  surface/underground navigation profiles. The
  mountain and mirrored underground views provide deterministic starting poses;
  the surface-clearance action demonstrates local vertical push-out without Home,
  while Home preserves the selected profile. Underground vertical middle-drag
  orbit crosses the terrain in either direction without becoming free-look or a
  continuous swept collision system. The public terrain and imagery services are
  best-effort and subject to their CORS, availability, attribution, and usage
  policies. The demo requests only current-view tiles; it does not prefetch, bulk
  download, or prepare offline data. If terrain requests fail, a ready ancestor or
  flat fallback keeps the world usable.
  Sources: https://developers.arcgis.com/documentation/tiled-elevation-service/
  and https://operations.osmfoundation.org/policies/tiles/
labels:
  - SceneGIS
  - Terrain
  - Viewer
development: false
