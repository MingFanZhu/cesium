<style>
  @import url(../templates/bucket.css);
</style>
<div id="cesiumContainer" class="fullSize"></div>
<div id="loadingOverlay"><h1>正在加载……</h1></div>
<div id="toolbar"></div>
<div class="backdrop" id="filterControls">
  <strong>平面影像颜色滤镜</strong>
  <label
    >亮度（Brightness）
    <input id="brightness" type="range" min="0" max="2" step="0.01" value="1"
  /></label>
  <label
    >对比度（Contrast）
    <input id="contrast" type="range" min="0" max="2" step="0.01" value="1"
  /></label>
  <label
    >色相（Hue）
    <input
      id="hue"
      type="range"
      min="-3.1416"
      max="3.1416"
      step="0.01"
      value="0"
  /></label>
  <label
    >饱和度（Saturation）
    <input id="saturation" type="range" min="0" max="2" step="0.01" value="1"
  /></label>
  <label
    >伽马（Gamma）
    <input id="gamma" type="range" min="0.1" max="3" step="0.01" value="1"
  /></label>
  <label><input id="colorToAlphaEnabled" type="checkbox" /> 按颜色透明</label>
  <label
    >目标颜色 <input id="colorToAlpha" type="color" value="#ffffff"
  /></label>
  <label
    >透明阈值
    <input
      id="colorToAlphaThreshold"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.004"
  /></label>
  <button id="resetFilters" type="button">重置滤镜</button>
</div>
<div class="backdrop" id="status">
  OpenStreetMap
  瓦片仅按当前视图加载。公共服务不可用时，仍会显示平面底色或已就绪的祖先瓦片。
</div>

    max-height: calc(100% - 104px);
    overflow: auto;
    box-sizing: border-box;
    padding: 8px;
    color: white;

    border-radius: 4px;
  }
  #filterControls label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  #status {
    position: absolute;
    z-index: 2;
    right: 8px;
    bottom: 28px;
    left: 8px;
    max-width: 760px;
    max-height: 60px;
    overflow: auto;
    box-sizing: border-box;
    padding: 8px;
    color: white;
    background: rgb(42 42 42 / 90%);
    border: 1px solid rgb(255 255 255 / 35%);
