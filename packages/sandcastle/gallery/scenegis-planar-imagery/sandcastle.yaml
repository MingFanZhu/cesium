title: SceneGIS Planar Imagery
description: >-
  Renders an EPSG:3857 planar world with best-effort OpenStreetMap raster tiles,
  interactive brightness, contrast, hue, saturation, gamma, and color-to-alpha filters,
  ready-ancestor fallback, explicit PC planar navigation, and an application-selected
  Earth skybox. The skybox is not an implicit planar-world environment. The demo requests
  only tiles needed by the current interactive view and follows the OpenStreetMap
  tile usage policy; it does not prefetch or download tiles for offline use.
  Policy: https://operations.osmfoundation.org/policies/tiles/
labels:
  - SceneGIS
  - Imagery
development: false
