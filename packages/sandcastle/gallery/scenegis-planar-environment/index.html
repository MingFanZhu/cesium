<style>
  @import url(../templates/bucket.css);

  #environmentControls {
    position: absolute;
    z-index: 2;
    top: 5px;
    left: 5px;
    max-width: min(380px, calc(100% - 20px));
    max-height: calc(100% - 70px);
    overflow: auto;
  }

  #directionStatus {
    display: block;
    overflow-wrap: anywhere;
  }
</style>
<div id="cesiumContainer" class="fullSize"></div>
<div id="loadingOverlay"><h1>正在加载……</h1></div>
<div id="environmentControls">
  <strong>平面环境手动光照</strong>
  <label>
    太阳方位角（从北顺时针）
    <input
      id="sunAzimuth"
      type="range"
      min="0"
      max="360"
      step="1"
      value="315"
    />
  </label>
  <label>
    太阳仰角
    <input
      id="sunElevation"
      type="range"
      min="-10"
      max="90"
      step="1"
      value="35"
    />
  </label>
  <label>
    太阳光强度
    <input
      id="sunIntensity"
      type="range"
      min="0"
      max="5"
      step="0.1"
      value="2"
    />
  </label>
  <label
    ><input id="lightingToggle" type="checkbox" checked /> 启用地形光照</label
  >
  <label
    ><input id="environmentToggle" type="checkbox" checked />
    环境控制器取得光照控制权</label
  >
  <button id="resetEnvironment" type="button">恢复手动默认值</button>
  <span id="directionStatus">正在计算太阳方向……</span>
  <span>
    坐标轴固定为 +X 东、+Y 北、+Z
    上。月球方向在本阶段仅保存为未来状态，不显示月球，也不产生第二个光源。
  </span>
</div>
