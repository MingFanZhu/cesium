<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>平面 GeoJSON</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      html,
      body,
      #view {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #panel {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 245px;
        padding: 18px;
        border-radius: 8px;
        background: #102136ee;
        color: #e8edf6;
        font:
          14px/1.65 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 21px;
      }
      p {
        color: #bbcede;
        margin: 10px 0;
      }
      button {
        padding: 6px 10px;
        margin: 4px 4px 4px 0;
        cursor: pointer;
      }
      label {
        display: block;
      }
      output {
        display: block;
        margin-top: 12px;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <section id="panel">
      <h1>平面 GeoJSON</h1>
      <p>
        南京坐标 · 本地示意地形。绿色带孔面、蓝线和 G 点贴地；橙面与 Z
        点保留绝对高度。
      </p>
      <label><input id="visible" type="checkbox" checked /> 显示 GeoJSON</label>
      <label><input id="terrain" type="checkbox" checked /> 显示示意地形</label>
      <button id="home" disabled>回到初始视角</button>
      <button id="zoom" disabled>定位全部要素</button>
      <button id="reload" disabled>重新加载</button>
      <p>
        点击图形可查看原始属性。粉线手动关闭贴地，用于对比普通线。该页不依赖在线底图或地形。
      </p>
      <output id="status">正在加载…</output>
    </section>
    <script type="module">
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
      const C = await import("/Build/CesiumUnminified/index.js");
      const projection = new C.WebMercatorProjection();
      const center = projection.project(
        C.Cartographic.fromDegrees(118.787, 32.061),
      );
      const world = new C.SceneGISPlanarWorld({
        coordinateSystem: new C.SceneGISPlanarCoordinateSystem({
          extent: new C.SceneGISPlanarExtent({
            minimumX: center.x - 3500,
            minimumY: center.y - 3500,
            maximumX: center.x + 3500,
            maximumY: center.y + 3500,
          }),
          crs: "EPSG:3857",
        }),
        maximumLevel: 0,
        baseColor: C.Color.fromCssColorString("#344b63"),
      });
      const terrainData = new C.SceneGISPlanarHeightmapTerrainData({
        buffer: new Float32Array([0, 0, 0, 0, 260, 0, 0, 0, 0]),
        width: 3,
        height: 3,
      });
      const provider = {
        tilingScheme: world.tilingScheme,
        minimumHeight: 0,
        maximumHeight: 260,
        maximumLevel: 0,
        errorEvent: new C.Event(),
        getLevelMaximumGeometricError: () => 100,
        requestTileGeometry: () => Promise.resolve(terrainData),
        getTileDataAvailable: () => true,
        loadTileDataAvailability: () => undefined,
      };
      world.terrainProvider = provider;
      const viewer = new C.Viewer("view", {
        world,
        animation: false,
        timeline: false,
        fullscreenButton: false,
      });
      viewer.scene.environmentEffects.enabled = false;
      viewer.scene.highDynamicRange = false;
      const status = document.querySelector("#status");
      const url =
        "/packages/engine/Specs/SceneGIS/DataSources/Data/planar-geojson.geojson";
      function home() {
        viewer.camera.setView({
          destination: new C.Cartesian3(center.x, center.y - 4200, 6000),
          orientation: { heading: 0, pitch: C.Math.toRadians(-55), roll: 0 },
        });
      }
      home();
      let source;
      async function load() {
        document.querySelector("#reload").disabled = true;
        try {
          if (source) {
            await source.load(url, { clampToGround: true });
          } else {
            source = await C.GeoJsonDataSource.load(url, {
              planar: {
                world,
                projectCoordinates(coordinates, crs) {
                  if (crs !== undefined) {
                    throw new Error("示例只接受无 CRS 覆盖的 WGS84 GeoJSON。");
                  }
                  return projection.project(
                    C.Cartographic.fromDegrees(
                      coordinates[0],
                      coordinates[1],
                      coordinates[2] ?? 0,
                    ),
                  );
                },
              },
              clampToGround: true,
            });
            await viewer.dataSources.add(source);
          }
          // Native line clamping applies to 3D input too; select an ordinary line explicitly.
          source.entities.getById("raised-line").polyline.clampToGround = false;
          source.show = document.querySelector("#visible").checked;
          status.textContent = `已加载 ${source.entities.values.length} 个要素。\n坐标转换仅在加载时执行。`;
          document.querySelector("#home").disabled = false;
          document.querySelector("#zoom").disabled = false;
          window.planarGeoJsonExample = { viewer, world, source };
        } catch (error) {
          status.textContent = `加载失败：${error.message}`;
        } finally {
          document.querySelector("#reload").disabled = false;
        }
      }
      document.querySelector("#home").onclick = home;
      document.querySelector("#zoom").onclick = () => viewer.zoomTo(source);
      document.querySelector("#reload").onclick = load;
      document.querySelector("#visible").onchange = (event) => {
        if (source) {
          source.show = event.target.checked;
        }
      };
      document.querySelector("#terrain").onchange = (event) => {
        world.terrainProvider = event.target.checked ? provider : undefined;
      };
      window.addEventListener("pagehide", (event) => {
        if (!event.persisted && !viewer.isDestroyed()) {
          viewer.destroy();
        }
      });
      await load();
    </script>
  </body>
</html>
