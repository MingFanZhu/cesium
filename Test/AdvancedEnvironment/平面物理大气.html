<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>平面物理大气</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />

  <body>
    <div id="map"></div>
    <aside>
      <h1>平面物理大气</h1>
      <p>
        默认正午，HDR
        与自动曝光关闭。可调整北京时间查看全天；夜间环境光随天空照度平滑衔接。
        远处模型可观察空气透视的衰减；单独调整天空、空气和地表亮度。
      </p>
      <p>
        平面使用本地米制坐标，Z 为高度；南京经纬度仅作为日月方向的天文参考。
      </p>
      <p>
        <a href="示例目录.html">全部环境示例</a> ·
        <a href="平面物理大气.js" target="_blank">查看源码</a>
      </p>
    </aside>
    <div id="controls"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./平面物理大气.js"></script>
  </body>
