<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>局部水面</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <link rel="stylesheet" href="/Test/examples.css" />
  </head>
  <body>
    <div id="map"></div>
    <aside>
      <h1>局部水面</h1>
      <p>颜色可自由调整；清水、湖水、浑水预设可作为起点。</p>
      <p>透射颜色对应指定着色距离；散射颜色与浑浊度控制水中悬浮物。</p>
      <p>法线波纹改变表面反光；FFT 风浪具有几何起伏和浪尖白沫。</p>
      <p>关闭水面可查看水下结构；关闭时间动画可固定对比画面。</p>
      <p>预设用于外观演示。岸边白沫仍为接触近似，焦散与水下视角尚未启用。</p>
      <p>
        <a href="?world=planar">平面</a> · <a href="?world=globe">球面</a> ·
        <a href="示例目录.html">目录</a>
      </p>

      <div id="error"></div>
    </aside>
    <div id="controls"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./局部水面.js"></script>
  </body>
</html>
