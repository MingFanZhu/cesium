  <body>
    <div id="map"></div>
    <aside>
      <h1>物理天空环境反射</h1>
      <p>前排金属，后排涂层陶瓷。由左到右，粗糙度从 0.04 增至 0.9。</p>
      <p>切换镜面反射、时间与视角，观察天空颜色和地平线在曲面上的变化。</p>
      <p>本例反射来自天空与近似地面，周围物体和云层尚未进入反射。</p>
      <p>
        <a href="?world=planar">平面</a> · <a href="?world=globe">球面</a> ·
        <a href="示例目录.html">目录</a>
      </p>
      <div id="error"></div>
    </aside>
    <div id="controls"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./环境反射.js"></script>
