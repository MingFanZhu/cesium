<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>屏幕空间反射</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <link rel="stylesheet" href="/Test/examples.css" />
  </head>
  <body>
    <div id="map"></div>
    <aside>
      <h1>屏幕空间反射</h1>
      <p>彩色方块在金属地板上形成倒影，支持球面和平面。</p>
      <p>
        切换屏幕空间反射，调整地板粗糙度并移动相机，观察倒影与环境反射的过渡。
      </p>
      <p>SSR 只反射屏幕内的不透明物体；屏幕外和较粗糙区域保留天空环境反射。</p>
      <p>
        <a href="?world=planar">平面</a> · <a href="?world=globe">球面</a> ·
        <a href="示例目录.html">目录</a>
      </p>
      <div id="error"></div>
    </aside>
    <div id="controls"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./屏幕空间反射.js"></script>
  </body>
</html>
