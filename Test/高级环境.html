<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceneGIS 高级环境</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: #eef5fa;
        background: #071019;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr;
        width: 100%;
        height: 100%;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 10px 16px;
        border-bottom: 1px solid #294455;
        background: #10202c;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .worlds {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
      }
      section {
        position: relative;
        min-width: 0;
        min-height: 0;
        border-right: 1px solid #294455;
      }
      section:last-child {
        border-right: 0;
      }
      .viewer {
        position: absolute;
        inset: 0;
      }
      .badge {
        position: absolute;
        z-index: 2;
        top: 10px;
        left: 10px;
        padding: 7px 10px;
        border: 1px solid #54788d;
        border-radius: 6px;
        background: rgb(5 16 24 / 82%);
        pointer-events: none;
      }
      .badge strong,
      .badge span {
        display: block;
      }
      .badge span {
        margin-top: 3px;
        color: #a8c1d0;
        font-size: 12px;
      }
      @media (max-width: 900px) {
        .worlds {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
        section {
          border-right: 0;
          border-bottom: 1px solid #294455;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>A3 双世界大气、空气透视与指数高度雾（本地、零网络）</h1>
        <div class="controls">
          <label><input id="enabled" type="checkbox" />启用</label>
          <label
            ><input id="atmosphere" type="checkbox" checked />天空与太阳</label
          >
          <label><input id="aerial" type="checkbox" checked />空气透视</label>
          <label
            ><input id="heightFog" type="checkbox" checked />指数高度雾</label
          >
          <label
            >Background radiance
            <input
              id="backgroundRadianceScale"
              type="range"
              min="0"
              max="64"
              step="1"
              value="10"
            />
            <output id="backgroundRadianceScaleValue">10</output></label
          >
          <label
            >Fog density
            <input
              id="heightFogDensity"
              type="range"
              min="0"
              max="0.001"
              step="0.00001"
              value="0.000008"
            />
            <output id="heightFogDensityValue">0.000008</output></label
          >
          <label
            >Fog falloff
            <input
              id="heightFogHeightFalloff"
              type="range"
              min="0"
              max="0.001"
              step="0.00005"
              value="0.0002"
            />
            <output id="heightFogHeightFalloffValue">0.0002</output></label
          >
          <label
            >Fog base Z
            <input
              id="heightFogBaseHeight"
              type="range"
              min="-60000"
              max="60000"
              step="100"
              value="0"
            />
            <output id="heightFogBaseHeightValue">0</output></label
          >
          <label
            >Fog start
            <input
              id="heightFogStartDistance"
              type="range"
              min="0"
              max="300000"
              step="50"
              value="250"
            />
            <output id="heightFogStartDistanceValue">250</output></label
          >
          <label
            >Fog max opacity
            <input
              id="heightFogMaximumOpacity"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.70"
            />
            <output id="heightFogMaximumOpacityValue">0.70</output></label
          >
          <label
            >Fog ambient
            <input
              id="heightFogInscatteringScale"
              type="range"
              min="0"
              max="64"
              step="0.05"
              value="0.35"
            />
            <output id="heightFogInscatteringScaleValue">0.35</output></label
          >
          <label
            >Fog directional
            <input
              id="heightFogDirectionalInscatteringScale"
              type="range"
              min="0"
              max="64"
              step="0.05"
              value="0.15"
            />
            <output id="heightFogDirectionalInscatteringScaleValue"
              >0.15</output
            ></label
          >
          <label
            >Fog lobe exponent
            <input
              id="heightFogDirectionalInscatteringExponent"
              type="range"
              min="1"
              max="128"
              step="1"
              value="8"
            />
            <output id="heightFogDirectionalInscatteringExponentValue"
              >8</output
            ></label
          >
          <label
            >Aerial radiance
            <input
              id="aerialRadianceScale"
              type="range"
              min="0"
              max="64"
              step="0.1"
              value="1"
            />
            <output id="aerialRadianceScaleValue">1</output></label
          >
          <button id="day" type="button">白昼</button>
          <button id="sunset" type="button">日落</button>
          <button id="night" type="button">夜间</button>
          <button id="ground" type="button">地面</button>
          <button id="air" type="button">空中</button>
          <button id="high" type="button">高空</button>
          <button id="highMiss" type="button">高空不穿层</button>
          <button id="perspective" type="button">Perspective</button>
          <button id="orthographic" type="button">Orthographic</button>
          <button id="diagnostic" type="button">对比 enabled / identity</button>
          <button id="nativeConflict" type="button">
            注入 native Fog 冲突
          </button>
          <button id="simpleConflict" type="button">
            注入 planar simple 冲突
          </button>
          <button id="retry" type="button">修复并重试</button>
        </div>
      </header>
      <div class="worlds">
        <section>
          <div id="globeViewer" class="viewer"></div>
          <div class="badge">
            <strong>Globe · Bruneton combined LUT</strong>
            <span id="globeStatus">初始化</span>
            <span id="globeDiagnostic">identity delta · 未测</span>
          </div>
        </section>
        <section>
          <div id="planarViewer" class="viewer"></div>
          <div class="badge">
            <strong>Planar · +Z flat LUT · scattering orders 1–4</strong>
            <span id="planarStatus">初始化</span>
            <span id="planarTransport">slab / geometry · 未测</span>
            <span id="planarDiagnostic">identity delta · 未测</span>
          </div>
        </section>
      </div>
    </main>

    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module">
      import * as Cesium from "/Build/CesiumUnminified/index.js";

      try {
        const viewerOptions = {
          animation: false,
          baseLayer: false,
          baseLayerPicker: false,
          fullscreenButton: false,
          geocoder: false,
          homeButton: false,
          infoBox: false,
          navigationHelpButton: false,
          scene3DOnly: true,
          selectionIndicator: false,
          timeline: false,
          requestRenderMode: true,
        };

        function hideNativeEnvironment(scene) {
          for (const object of [
            scene.skyAtmosphere,
            scene.skyBox,
            scene.sun,
            scene.moon,
          ]) {
            if (object) {
              object.show = false;
            }
          }
          scene.sunBloom = false;
          scene.fog.enabled = false;
          if (scene.globe) {
            scene.globe.showGroundAtmosphere = false;
          }
          scene.highDynamicRange = true;
        }

        function addComparisonBoxes(scene, instances) {
          scene.primitives.add(
            new Cesium.Primitive({
              geometryInstances: instances.map(
                ({ position, dimensions, color }) =>
                  new Cesium.GeometryInstance({
                    geometry: Cesium.BoxGeometry.fromDimensions({ dimensions }),
                    modelMatrix: Cesium.Matrix4.fromTranslation(position),
                    attributes: {
                      color:
                        Cesium.ColorGeometryInstanceAttribute.fromColor(color),
                    },
                  }),
              ),
              appearance: new Cesium.PerInstanceColorAppearance({
                translucent: false,
                closed: true,
              }),
              asynchronous: false,
            }),
          );
        }

        let globeViewer = new Cesium.Viewer("globeViewer", viewerOptions);
        hideNativeEnvironment(globeViewer.scene);
        globeViewer.scene.globe.baseColor =
          Cesium.Color.fromCssColorString("#22302a");
        globeViewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(121.5, 31.2, 1200000.0),
          orientation: {
            heading: Cesium.Math.toRadians(15.0),
            pitch: Cesium.Math.toRadians(-36.0),
            roll: 0.0,
          },
        });
        const globeEffects = new Cesium.SceneGISEnvironmentEffects({
          mode: "globe",
          enabled: false,
        });
        globeViewer.addController(globeEffects);
        const globeBoxDimensions = new Cesium.Cartesian3(
          4000.0,
          4000.0,
          4000.0,
        );
        const globeComparisonPositions = [
          Cesium.Cartesian3.fromDegrees(121.47, 31.3, 1000.0),
          Cesium.Cartesian3.fromDegrees(121.57, 31.55, 1000.0),
        ];
        const globeGroundCameraPosition = Cesium.Cartesian3.fromDegrees(
          121.5,
          31.2,
          2000.0,
        );
        const globeGroundTarget = Cesium.Cartesian3.midpoint(
          globeComparisonPositions[0],
          globeComparisonPositions[1],
          new Cesium.Cartesian3(),
        );
        const globeGroundDirection = Cesium.Cartesian3.normalize(
          Cesium.Cartesian3.subtract(
            globeGroundTarget,
            globeGroundCameraPosition,
            new Cesium.Cartesian3(),
          ),
          new Cesium.Cartesian3(),
        );
        const globeGroundNormal = Cesium.Cartesian3.normalize(
          globeGroundCameraPosition,
          new Cesium.Cartesian3(),
        );
        const globeGroundRight = Cesium.Cartesian3.normalize(
          Cesium.Cartesian3.cross(
            globeGroundDirection,
            globeGroundNormal,
            new Cesium.Cartesian3(),
          ),
          new Cesium.Cartesian3(),
        );
        const globeGroundUp = Cesium.Cartesian3.normalize(
          Cesium.Cartesian3.cross(
            globeGroundRight,
            globeGroundDirection,
            new Cesium.Cartesian3(),
          ),
          new Cesium.Cartesian3(),
        );
        const globeNearTransform = Cesium.Transforms.eastNorthUpToFixedFrame(
          globeComparisonPositions[0],
        );
        const globeFarTransform = Cesium.Transforms.eastNorthUpToFixedFrame(
          globeComparisonPositions[1],
        );
        globeViewer.scene.primitives.add(
          new Cesium.Primitive({
            geometryInstances: [
              new Cesium.GeometryInstance({
                geometry: Cesium.BoxGeometry.fromDimensions({
                  dimensions: globeBoxDimensions,
                }),
                modelMatrix: globeNearTransform,
                attributes: {
                  color: Cesium.ColorGeometryInstanceAttribute.fromColor(
                    Cesium.Color.WHITE,
                  ),
                },
              }),
              new Cesium.GeometryInstance({
                geometry: Cesium.BoxGeometry.fromDimensions({
                  dimensions: globeBoxDimensions,
                }),
                modelMatrix: globeFarTransform,
                attributes: {
                  color: Cesium.ColorGeometryInstanceAttribute.fromColor(
                    Cesium.Color.WHITE,
                  ),
                },
              }),
            ],
            appearance: new Cesium.PerInstanceColorAppearance({
              translucent: false,
              closed: true,
            }),
            asynchronous: false,
          }),
        );

        const limit = 20037508.342789244;
        let planarViewer = new Cesium.Viewer("planarViewer", {
          ...viewerOptions,
          baseLayer: undefined,
          planarWorld: {
            crs: "EPSG:3857",
            extent: {
              minimumX: -limit,
              minimumY: -limit,
              maximumX: limit,
              maximumY: limit,
            },
            maximumLevel: 0,
          },
        });
        const planarScene = planarViewer.scene;
        hideNativeEnvironment(planarScene);
        const world = planarScene.world;
        world.baseColor = Cesium.Color.fromCssColorString("#26362f");
        planarViewer.camera.setView({
          destination: new Cesium.Cartesian3(0.0, -800000.0, 500000.0),
          orientation: {
            direction: new Cesium.Cartesian3(0.0, 0.82, -0.57),
            up: new Cesium.Cartesian3(0.0, 0.57, 0.82),
          },
        });
        const planarEnvironment = new Cesium.SceneGISPlanarEnvironment({
          world,
          showAtmosphere: false,
          showSun: false,
          showMoon: false,
          sunDirection: Cesium.Cartesian3.normalize(
            new Cesium.Cartesian3(0.45, 0.2, 0.87),
            new Cesium.Cartesian3(),
          ),
          moonDirection: new Cesium.Cartesian3(-0.5, -0.2, 0.8),
        });
        const planarEffects = new Cesium.SceneGISEnvironmentEffects({
          mode: "planar",
          world,
          enabled: false,
        });
        planarViewer.addController(planarEnvironment);
        planarViewer.addController(planarEffects);
        const planarComparisonBoxes = [
          {
            position: new Cesium.Cartesian3(-70000.0, -250000.0, 40000.0),
            dimensions: new Cesium.Cartesian3(120000.0, 100000.0, 80000.0),
            color: Cesium.Color.WHITE,
          },
          {
            position: new Cesium.Cartesian3(70000.0, 350000.0, 40000.0),
            dimensions: new Cesium.Cartesian3(120000.0, 100000.0, 80000.0),
            color: Cesium.Color.YELLOW,
          },
        ];
        addComparisonBoxes(planarScene, planarComparisonBoxes);

        window.globeViewer = globeViewer;
        window.planarViewer = planarViewer;
        window.globeEffects = globeEffects;
        window.planarEffects = planarEffects;
        window.planarEnvironment = planarEnvironment;
        window.environmentDiagnostics = {};

        const environmentRenderEvidence = {
          renderErrors: [],
          successfulFrames: {
            globe: 0,
            planar: 0,
          },
        };
        function recordRenderError(world, _scene, error) {
          environmentRenderEvidence.renderErrors.push({
            world,
            message: error?.message ?? String(error),
          });
        }
        const removeGlobeRenderError =
          globeViewer.scene.renderError.addEventListener((scene, error) => {
            recordRenderError("globe", scene, error);
          });
        const removePlanarRenderError =
          planarScene.renderError.addEventListener((scene, error) => {
            recordRenderError("planar", scene, error);
          });

        function finiteOrderedFrustum(scene) {
          const frustum = scene.camera.frustum;
          const common =
            Number.isFinite(frustum.near) &&
            Number.isFinite(frustum.far) &&
            frustum.near > 0.0 &&
            frustum.far > frustum.near;
          if (!common) {
            return false;
          }
          if (frustum instanceof Cesium.OrthographicFrustum) {
            const bounds = frustum.offCenterFrustum;
            return (
              Number.isFinite(bounds.left) &&
              Number.isFinite(bounds.right) &&
              Number.isFinite(bounds.bottom) &&
              Number.isFinite(bounds.top) &&
              bounds.right > bounds.left &&
              bounds.top > bounds.bottom
            );
          }
          const nearTop =
            frustum.near * Math.tan(0.5 * (frustum.fovy ?? frustum.fov));
          const nearRight = nearTop * frustum.aspectRatio;
          return (
            Number.isFinite(nearTop) &&
            Number.isFinite(nearRight) &&
            nearTop > 0.0 &&
            nearRight > 0.0
          );
        }

        function visibleCesiumErrorPanels() {
          return Array.from(
            document.querySelectorAll(".cesium-widget-errorPanel"),
          ).filter((panel) => {
            const style = getComputedStyle(panel);
            return style.display !== "none" && style.visibility !== "hidden";
          });
        }

        window.environmentRenderEvidence = environmentRenderEvidence;
        window.validateEnvironmentRenderState = function () {
          return {
            renderErrors: environmentRenderEvidence.renderErrors.slice(),
            successfulFrames: { ...environmentRenderEvidence.successfulFrames },
            globeFrustumValid: finiteOrderedFrustum(globeViewer.scene),
            planarFrustumValid: finiteOrderedFrustum(planarScene),
            visibleErrorPanels: visibleCesiumErrorPanels().length,
          };
        };

        const effects = [globeEffects, planarEffects];
        let currentLighting = "day";
        let currentCameraPreset = "ground";
        let retryRenderInterval;
        function driveEffectsUntilSettled() {
          globeViewer.scene.requestRenderMode = false;
          planarScene.requestRenderMode = false;
          let attempts = 0;
          clearInterval(retryRenderInterval);
          retryRenderInterval = setInterval(() => {
            globeViewer.scene.requestRender();
            planarScene.requestRender();
            attempts++;
            if (
              effects.every((controller) => controller.ready) ||
              attempts >= 100
            ) {
              globeViewer.scene.requestRenderMode = true;
              planarScene.requestRenderMode = true;
              clearInterval(retryRenderInterval);
              retryRenderInterval = undefined;
            }
          }, 50);
        }
        function updateEffects(property, value) {
          for (const controller of effects) {
            controller[property] = value;
          }
          globeViewer.scene.requestRender();
          planarViewer.scene.requestRender();
        }
        document
          .querySelector("#enabled")
          .addEventListener("change", (event) => {
            updateEffects("enabled", event.target.checked);
            if (event.target.checked) {
              driveEffectsUntilSettled();
            }
          });
        document
          .querySelector("#atmosphere")
          .addEventListener("change", (event) => {
            updateEffects("showAtmosphere", event.target.checked);
          });
        document
          .querySelector("#aerial")
          .addEventListener("change", (event) => {
            updateEffects("showAerialPerspective", event.target.checked);
          });
        document
          .querySelector("#heightFog")
          .addEventListener("change", (event) => {
            updateEffects("showHeightFog", event.target.checked);
          });
        for (const property of [
          "backgroundRadianceScale",
          "aerialRadianceScale",
          "heightFogDensity",
          "heightFogHeightFalloff",
          "heightFogBaseHeight",
          "heightFogStartDistance",
          "heightFogMaximumOpacity",
          "heightFogInscatteringScale",
          "heightFogDirectionalInscatteringScale",
          "heightFogDirectionalInscatteringExponent",
        ]) {
          document
            .querySelector(`#${property}`)
            .addEventListener("input", (event) => {
              const value = Number(event.target.value);
              document.querySelector(`#${property}Value`).value = value;
              updateEffects(property, value);
            });
        }

        function setPlanarSun(x, y, z) {
          planarEnvironment.sunDirection = Cesium.Cartesian3.normalize(
            new Cesium.Cartesian3(x, y, z),
            new Cesium.Cartesian3(),
          );
          planarScene.requestRender();
        }
        document.querySelector("#day").addEventListener("click", () => {
          currentLighting = "day";
          globeViewer.clock.currentTime = Cesium.JulianDate.fromIso8601(
            "2026-06-21T04:00:00Z",
          );
          setPlanarSun(0.45, 0.2, 0.87);
          globeViewer.scene.requestRender();
        });
        document.querySelector("#sunset").addEventListener("click", () => {
          currentLighting = "sunset";
          globeViewer.clock.currentTime = Cesium.JulianDate.fromIso8601(
            "2026-06-21T10:30:00Z",
          );
          setPlanarSun(0.95, 0.1, 0.08);
          globeViewer.scene.requestRender();
        });
        document.querySelector("#night").addEventListener("click", () => {
          currentLighting = "night";
          globeViewer.clock.currentTime = Cesium.JulianDate.fromIso8601(
            "2026-06-21T16:00:00Z",
          );
          setPlanarSun(-0.45, -0.2, -0.87);
          globeViewer.scene.requestRender();
        });

        const cameraPresets = {
          ground: {
            globeAltitude: 2000.0,
            globeDestination: globeGroundCameraPosition,
            globeDirection: globeGroundDirection,
            globeUp: globeGroundUp,
            planarPosition: new Cesium.Cartesian3(0.0, -180000.0, 5000.0),
          },
          air: {
            globeAltitude: 30000.0,
            planarPosition: new Cesium.Cartesian3(0.0, -350000.0, 30000.0),
          },
          high: {
            globeAltitude: 250000.0,
            planarPosition: new Cesium.Cartesian3(0.0, -900000.0, 120000.0),
          },
          highMiss: {
            globeAltitude: 250000.0,
            globePitch: 0.0,
            planarPosition: new Cesium.Cartesian3(0.0, -900000.0, 120000.0),
            planarDirection: Cesium.Cartesian3.UNIT_Y,
          },
        };
        function applyCameraPreset(name) {
          currentCameraPreset = name;
          const preset = cameraPresets[name];
          globeViewer.camera.setView({
            destination:
              preset.globeDestination ??
              Cesium.Cartesian3.fromDegrees(121.5, 31.2, preset.globeAltitude),
            orientation: Cesium.defined(preset.globeDirection)
              ? {
                  direction: preset.globeDirection,
                  up: preset.globeUp,
                }
              : {
                  heading: 0.0,
                  pitch: preset.globePitch ?? Cesium.Math.toRadians(-12.0),
                  roll: 0.0,
                },
          });
          planarViewer.camera.setView({
            destination: preset.planarPosition,
            orientation: {
              direction:
                preset.planarDirection ??
                new Cesium.Cartesian3(0.0, 0.98, -0.2),
              up: new Cesium.Cartesian3(0.0, 0.2, 0.98),
            },
          });
          const direction = Cesium.Cartesian3.normalize(
            preset.planarDirection ?? new Cesium.Cartesian3(0.0, 0.98, -0.2),
            new Cesium.Cartesian3(),
          );
          const altitude = preset.planarPosition.z;
          const intersectsSlab = altitude <= 60000.0 || direction.z < -1.0e-7;
          const slabEntry = intersectsSlab
            ? altitude > 60000.0
              ? (altitude - 60000.0) / -direction.z
              : 0.0
            : Number.POSITIVE_INFINITY;
          const slabExit = intersectsSlab
            ? altitude / Math.max(-direction.z, 1.0e-7)
            : Number.POSITIVE_INFINITY;
          const boxDistances = planarComparisonBoxes.map(({ position }) =>
            Cesium.Cartesian3.distance(preset.planarPosition, position),
          );
          document.querySelector("#planarTransport").textContent =
            `slab entry/exit · ${(slabEntry / 1000.0).toFixed(0)}/${(
              slabExit / 1000.0
            ).toFixed(0)} km · geometry near/far · ${(
              Math.min(...boxDistances) / 1000.0
            ).toFixed(0)}/${(Math.max(...boxDistances) / 1000.0).toFixed(
              0,
            )} km`;
          globeViewer.scene.requestRender();
          planarScene.requestRender();
        }
        for (const name of ["ground", "air", "high", "highMiss"]) {
          document.querySelector(`#${name}`).addEventListener("click", () => {
            applyCameraPreset(name);
          });
        }
        document.querySelector("#perspective").addEventListener("click", () => {
          globeViewer.camera.switchToPerspectiveFrustum();
          planarViewer.camera.switchToPerspectiveFrustum();
          globeViewer.scene.requestRender();
          planarScene.requestRender();
        });
        document
          .querySelector("#orthographic")
          .addEventListener("click", () => {
            const widths = {
              ground: 200000.0,
              air: 700000.0,
              high: 1500000.0,
              highMiss: 1500000.0,
            };
            globeViewer.camera.switchToOrthographicFrustum();
            planarViewer.camera.switchToOrthographicFrustum();
            for (const camera of [globeViewer.camera, planarViewer.camera]) {
              camera.frustum.width = widths[currentCameraPreset];
              camera.frustum.near = 1.0;
              camera.frustum.far = 20000000.0;
            }
            globeViewer.scene.requestRender();
            planarScene.requestRender();
          });

        function nextRenderedSamples(scene) {
          return new Promise((resolve, reject) => {
            const removeError = scene.renderError.addEventListener(
              (_renderScene, error) => {
                remove();
                removeError();
                reject(error);
              },
            );
            const remove = scene.postRender.addEventListener(() => {
              remove();
              removeError();
              const width = scene.context.drawingBufferWidth;
              const height = scene.context.drawingBufferHeight;
              resolve({
                samples: Array.from(
                  scene.context.readPixels({ x: 0, y: 0, width, height }),
                ),
                width,
                height,
              });
            });
            scene.requestRender();
          });
        }

        function measureDelta(rendered, identity, region) {
          let delta = 0;
          let maximumDelta = 0;
          let changedPixels = 0;
          const { samples, width, height } = rendered;
          const bounds = region ?? { x: 0, y: 0, width, height };
          for (let y = bounds.y; y < bounds.y + bounds.height; y++) {
            for (let x = bounds.x; x < bounds.x + bounds.width; x++) {
              const index = (y * width + x) * 4;
              const pixelDelta =
                Math.abs(samples[index] - identity.samples[index]) +
                Math.abs(samples[index + 1] - identity.samples[index + 1]) +
                Math.abs(samples[index + 2] - identity.samples[index + 2]);
              delta += pixelDelta;
              maximumDelta = Math.max(maximumDelta, pixelDelta);
              changedPixels += pixelDelta > 0 ? 1 : 0;
            }
          }
          return {
            delta,
            maximumDelta,
            changedPixels,
            meanChangedDelta: changedPixels > 0 ? delta / changedPixels : 0,
          };
        }

        function targetRegion(
          scene,
          rendered,
          position,
          radiusFraction = 0.025,
        ) {
          const windowPosition =
            Cesium.SceneTransforms.worldToWindowCoordinates(scene, position);
          const radius = Math.max(
            12,
            Math.floor(
              Math.min(rendered.width, rendered.height) * radiusFraction,
            ),
          );
          const finiteProjection =
            Cesium.defined(windowPosition) &&
            Number.isFinite(windowPosition.x) &&
            Number.isFinite(windowPosition.y);
          if (!finiteProjection) {
            return { available: false };
          }
          const centerX = Math.round(windowPosition.x);
          const centerY = Math.round(rendered.height - windowPosition.y);
          const region = {
            x: centerX - radius,
            y: centerY - radius,
            width: radius * 2,
            height: radius * 2,
          };
          const inside =
            region.x >= 0 &&
            region.y >= 0 &&
            region.x + region.width <= rendered.width &&
            region.y + region.height <= rendered.height;
          return {
            available: inside,
            projection: { x: windowPosition.x, y: windowPosition.y },
            region,
          };
        }

        function regionsOverlap(left, right) {
          return !(
            left.x + left.width <= right.x ||
            right.x + right.width <= left.x ||
            left.y + left.height <= right.y ||
            right.y + right.height <= left.y
          );
        }

        async function diagnoseController(controller, scene, output, name) {
          if (!controller.enabled || !controller.ready) {
            output.textContent = "pass matrix · 请先启用并等待 ready";
            return;
          }
          const showAtmosphere = controller.showAtmosphere;
          const showAerialPerspective = controller.showAerialPerspective;
          const showHeightFog = controller.showHeightFog;
          controller.showAtmosphere = false;
          controller.showAerialPerspective = false;
          controller.showHeightFog = false;
          const identity = await nextRenderedSamples(scene);
          const matrix = {};
          let globeTargetEvidence;
          const planarFarTarget =
            name === "planar"
              ? targetRegion(
                  scene,
                  identity,
                  planarComparisonBoxes[1].position,
                  0.04,
                )
              : undefined;
          if (name === "globe") {
            const targetRegions = globeComparisonPositions.map((position) =>
              targetRegion(scene, identity, position),
            );
            const distances = globeComparisonPositions.map((position) =>
              Cesium.Cartesian3.distance(scene.camera.positionWC, position),
            );
            const projectionsAvailable = targetRegions.every(
              ({ available }) => available,
            );
            const distinct =
              projectionsAvailable &&
              !regionsOverlap(targetRegions[0].region, targetRegions[1].region);
            globeTargetEvidence = {
              available:
                projectionsAvailable && distinct && distances[1] > distances[0],
              distances,
              distanceOrdered: distances[1] > distances[0],
              distinct,
              targets: targetRegions,
            };
            matrix.targetEvidence = globeTargetEvidence;
          }
          for (const pass of [
            {
              name: "background",
              atmosphere: true,
              aerial: false,
              fog: false,
            },
            {
              name: "aerial",
              atmosphere: false,
              aerial: true,
              fog: false,
            },
            {
              name: "fog",
              atmosphere: false,
              aerial: false,
              fog: true,
            },
            {
              name: "combined",
              atmosphere: true,
              aerial: true,
              fog: true,
            },
          ]) {
            controller.showAtmosphere = pass.atmosphere;
            controller.showAerialPerspective = pass.aerial;
            controller.showHeightFog = pass.fog;
            const rendered = await nextRenderedSamples(scene);
            const groundRegion = {
              x: Math.floor(rendered.width * 0.25),
              y: Math.floor(rendered.height * 0.08),
              width: Math.floor(rendered.width * 0.5),
              height: Math.floor(rendered.height * 0.3),
            };
            const planarNearRegion = {
              x: Math.floor(rendered.width * 0.1),
              y: Math.floor(rendered.height * 0.12),
              width: Math.floor(rendered.width * 0.3),
              height: Math.floor(rendered.height * 0.35),
            };
            const nearRegion =
              name === "globe"
                ? globeTargetEvidence.available
                  ? globeTargetEvidence.targets[0].region
                  : undefined
                : planarNearRegion;
            const farRegion =
              name === "globe"
                ? globeTargetEvidence.available
                  ? globeTargetEvidence.targets[1].region
                  : undefined
                : planarFarTarget.available
                  ? planarFarTarget.region
                  : undefined;
            const unavailableDelta = {
              delta: 0,
              maximumDelta: 0,
              changedPixels: 0,
              meanChangedDelta: 0,
              unavailable: true,
            };
            matrix[pass.name] = {
              ...measureDelta(rendered, identity),
              groundRoi: measureDelta(rendered, identity, groundRegion),
              nearRoi: Cesium.defined(nearRegion)
                ? measureDelta(rendered, identity, nearRegion)
                : unavailableDelta,
              farRoi: Cesium.defined(farRegion)
                ? measureDelta(rendered, identity, farRegion)
                : unavailableDelta,
              groundRegion,
              nearRegion,
              farRegion,
            };
          }
          controller.showAtmosphere = showAtmosphere;
          controller.showAerialPerspective = showAerialPerspective;
          controller.showHeightFog = showHeightFog;
          scene.requestRender();
          window.environmentDiagnostics[name] = matrix;
          const describe = (pass) => {
            const value = matrix[pass];
            const requiresFloor =
              currentLighting !== "night" &&
              (currentCameraPreset !== "highMiss" || pass === "aerial");
            const expectation = requiresFloor
              ? value.maximumDelta >= 8 && value.changedPixels > 0
                ? "required≥8 PASS"
                : "required≥8 FAIL"
              : currentLighting === "night"
                ? value.delta === 0
                  ? "identity PASS"
                  : "night optional radiance"
                : "high background observational";
            const mean = value.meanChangedDelta.toFixed(2);
            const groundMean = value.groundRoi.meanChangedDelta.toFixed(2);
            const nearMean = value.nearRoi.meanChangedDelta.toFixed(2);
            const farMean = value.farRoi.meanChangedDelta.toFixed(2);
            const requiresSurfaceRetention =
              currentLighting === "day" &&
              currentCameraPreset === "ground" &&
              (pass === "aerial" || pass === "fog");
            const surfaceLimit = pass === "fog" ? 24 : 32;
            const surfaceExpectation = requiresSurfaceRetention
              ? value.meanChangedDelta > 0 &&
                value.meanChangedDelta <= surfaceLimit &&
                value.groundRoi.meanChangedDelta > 0 &&
                value.groundRoi.meanChangedDelta <= surfaceLimit
                ? `surface≤${surfaceLimit} PASS`
                : `surface≤${surfaceLimit} FAIL`
              : "";
            const distanceExpectation =
              pass === "fog" && currentCameraPreset === "ground"
                ? name === "globe" && !matrix.targetEvidence.available
                  ? "target diagnostic unavailable FAIL"
                  : value.nearRoi.changedPixels > 0 &&
                      value.farRoi.changedPixels > 0 &&
                      value.farRoi.meanChangedDelta >
                        value.nearRoi.meanChangedDelta
                    ? `far>near PASS margin=${(
                        value.farRoi.meanChangedDelta -
                        value.nearRoi.meanChangedDelta
                      ).toFixed(2)}`
                    : "far>near FAIL"
                : "";
            return `${pass} L1=${value.delta} max=${value.maximumDelta} changed=${value.changedPixels} mean=${mean} groundROImean=${groundMean} near=${nearMean} far=${farMean} ${expectation} ${surfaceExpectation} ${distanceExpectation}`;
          };
          output.textContent = `${describe("background")} · ${describe("aerial")} · ${describe("fog")} · ${describe("combined")}`;
          return matrix;
        }

        document
          .querySelector("#diagnostic")
          .addEventListener("click", async () => {
            await Promise.all([
              diagnoseController(
                globeEffects,
                globeViewer.scene,
                document.querySelector("#globeDiagnostic"),
                "globe",
              ),
              diagnoseController(
                planarEffects,
                planarScene,
                document.querySelector("#planarDiagnostic"),
                "planar",
              ),
            ]);
          });

        const errors = new Map();
        function revealNativeConflict(scene) {
          scene.fog.enabled = true;
        }
        function removeInjectedNativeConflict(scene) {
          scene.fog.enabled = false;
        }
        document
          .querySelector("#nativeConflict")
          .addEventListener("click", () => {
            if (!globeEffects.enabled || !globeEffects.ready) {
              errors.set(
                globeEffects,
                "请先启用并等待 Globe ready，再注入冲突",
              );
              globeViewer.scene.requestRender();
              return;
            }
            revealNativeConflict(globeViewer.scene);
            revealNativeConflict(planarScene);
            globeViewer.scene.requestRender();
          });
        document
          .querySelector("#simpleConflict")
          .addEventListener("click", () => {
            if (!planarEffects.enabled || !planarEffects.ready) {
              errors.set(
                planarEffects,
                "请先启用并等待 planar ready，再注入冲突",
              );
              planarScene.requestRender();
              return;
            }
            planarEnvironment.showAtmosphere = true;
            planarScene.requestRender();
          });
        document.querySelector("#retry").addEventListener("click", () => {
          removeInjectedNativeConflict(globeViewer.scene, false);
          removeInjectedNativeConflict(planarScene, false);
          hideNativeEnvironment(globeViewer.scene);
          hideNativeEnvironment(planarScene);
          planarEnvironment.showAtmosphere = false;
          errors.clear();
          updateEffects("enabled", false);
          globeViewer.removeController(globeEffects);
          planarViewer.removeController(planarEffects);
          document.querySelector("#enabled").checked = false;
          setTimeout(() => {
            removeInjectedNativeConflict(globeViewer.scene, true);
            removeInjectedNativeConflict(planarScene, true);
            hideNativeEnvironment(globeViewer.scene);
            hideNativeEnvironment(planarScene);
            globeViewer.addController(globeEffects);
            planarViewer.addController(planarEffects);
            updateEffects("enabled", true);
            document.querySelector("#enabled").checked = true;
            driveEffectsUntilSettled();
          }, 300);
        });

        function status(controller) {
          if (errors.has(controller)) {
            return `fail closed · ${errors.get(controller)}`;
          }
          if (!controller.enabled) {
            return "disabled · identity";
          }
          return controller.ready ? "ready · HDR" : "loading / unsupported";
        }
        const removeGlobePostRender =
          globeViewer.scene.postRender.addEventListener(() => {
            environmentRenderEvidence.successfulFrames.globe++;
            document.querySelector("#globeStatus").textContent =
              status(globeEffects);
          });
        const removePlanarPostRender =
          planarViewer.scene.postRender.addEventListener(() => {
            environmentRenderEvidence.successfulFrames.planar++;
            document.querySelector("#planarStatus").textContent =
              status(planarEffects);
          });
        for (const controller of effects) {
          controller.errorEvent.addEventListener((_owner, error) => {
            errors.set(controller, error.message ?? String(error));
            document.querySelector(
              controller === globeEffects ? "#globeStatus" : "#planarStatus",
            ).textContent = status(controller);
            console.error(
              "高级环境已 fail closed；关闭后重新启用可重试。",
              error,
            );
          });
        }

        applyCameraPreset("ground");

        let disposed = false;
        function dispose() {
          if (disposed) {
            return;
          }
          disposed = true;
          clearInterval(retryRenderInterval);
          removeGlobePostRender();
          removePlanarPostRender();
          removeGlobeRenderError();
          removePlanarRenderError();
          if (!globeViewer.isDestroyed()) {
            globeViewer.removeController(globeEffects);
            globeViewer = globeViewer.destroy();
          }
          if (!planarViewer.isDestroyed()) {
            planarViewer.removeController(planarEffects);
            planarViewer.removeController(planarEnvironment);
            planarViewer = planarViewer.destroy();
          }
        }
        window.addEventListener("pagehide", (event) => {
          if (!event.persisted) {
            dispose();
          }
        });
      } catch (error) {
        window.a2InitializationError = error.stack ?? String(error);
        console.error(window.a2InitializationError);
      }
    </script>
  </body>
</html>
