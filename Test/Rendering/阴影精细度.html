      <h1>阴影精细度</h1>
      <p>观察细杆、悬空横梁、斜面与远近级联的阴影。</p>
      <p>
        软阴影采用连续滤波；降低分辨率可放大边缘差别。阴影距离越大，同等分辨率下细节越少。
      </p>
      <p>移动视角观察稳定性；打开级联颜色可检查分级覆盖与过渡。</p>
