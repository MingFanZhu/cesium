<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGL 延迟渲染 · 扩展材质与点云</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      aside {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 270px;
        padding: 16px;
        background: #172333ed;
        color: #edf4ff;
        font: 14px/1.55 sans-serif;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      select,
      button,
      input {
        font: inherit;
      }
      input[type="range"] {
        width: 140px;
      }
      #error {
        color: #ffaaaa;
      }
      small {
        color: #b7c8dc;
      }
      a {
        color: #8dcaff;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside>
      <h1>扩展材质与点云</h1>
      <p>
        从左到右：镜面、清漆、各向异性、组合材质与原生轮廓；后方为受光点云。
      </p>
      <label
        ><input id="effects" type="checkbox" checked />AO、SSR 与间接光</label
      >
      <label><input id="classification" type="checkbox" />点云分类范围</label>
      <label><input id="clip" type="checkbox" />裁剪组合模型</label>
      <label
        >裁剪位置
        <input
          id="clipPosition"
          type="range"
          min="-0.6"
          max="0.6"
          value="0"
          step="0.02"
      /></label>
      <label
        ><input
          id="silhouette"
          type="checkbox"
          checked
        />各向异性模型描边</label
      >
      <label
        ><input id="outline" type="checkbox" checked />原生 primitive
        outline</label
      >
      <label
        >点云样式
        <select id="points">
          <option value="orange">橙色</option>
          <option value="cyan">青色</option>
          <option value="translucent">半透明</option>
          <option value="hidden">隐藏</option>
        </select></label
      >
      <label
        >点大小
        <input id="pointSize" type="range" min="1" max="10" step="1" value="4"
      /></label>
      <label><input id="hdr" type="checkbox" checked />HDR 显示</label>
      <button id="home">复位视角</button>
      <p id="picked">点击物体检查拾取</p>
      <p id="stats">加载本地内容…</p>
      <small
        >分类开关也用于验证附件超限时的材质提交。所有不透明物体保持延迟光照。</small
      >
      <p>
        <a href="延迟平面验收.html">地表</a> ·
        <a href="延迟图元验收.html">图元</a> ·
        <a href="延迟要素样式.html">要素</a>
      </p>
      <p id="error" role="alert"></p>
    </aside>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./延迟扩展材质验收.js"></script>
  </body>
</html>
