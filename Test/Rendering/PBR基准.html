      <h1>Sponza PBR 基准</h1>
      <p>Intel Sponza 2022 · 官方几何与材质</p>
      <p id="status" role="status">正在加载本地资源…</p>
      <p id="variant"></p>
      <p id="comparison"></p>
      <p>左键环视 · 中键平移 · 滚轮前后</p>
      <details>
        <summary>基准与数据说明</summary>
        <p>
          只加载 Sponza 主体，保留官方法线、材质与几何。默认 2K
          纹理为明确的交付派生版；原始 4K 数据完整保留。
        </p>
        <p>
          固定方向光与天空
          IBL、曝光和时刻。未导入资产中的灯光，不等同于作者的离线参考渲染；尚无室内探针或
          GI。
        </p>
        <p>
          A/B 只切换效果参数，不改变相机、资产和光照。导出配置用于跨版本复查。
        </p>
        <p><a href="pbr-data/README.md">来源、授权与资源准备</a></p>
      </details>
      <p>
        <a data-world="planar" href="?world=planar">平面</a> ·

        >
      </p>
