    <title>降雪细节 · 镜头结霜</title>

  <body>
    <div id="map"></div>
    <aside>
      <h1>镜头结霜</h1>
      <p>
        冰晶霜纹从镜头四周向内覆盖，中央保留清晰视野。调节结霜强度和范围，观察霜层的透光与模糊效果。
      </p>
      <p>
        霜纹使用静态贴图，镜头移动时保持在屏幕上，不随时间飘动或融化。镜头结霜与地表积雪独立，空中降雪请看鸟瞰天气。
      </p>
      <p>
        默认只覆盖画面边缘，范围增大后逐渐延伸至中心。亮度随背景变化，不添加固定亮点高光。
      </p>

        <a href="?world=planar">平面</a> · <a href="?world=globe">球面</a> ·

      </p>

      <div id="error"></div>

      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
