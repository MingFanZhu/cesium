    <aside>
      <h1>雪落镜头</h1>
      <p>
        柔软雪点短暂附着，逐渐融化为轻微湿痕后消失。调整降雪强度、雪点尺寸和融化周期，观察镜头变化。
      </p>
      <p>
        镜头雪点与地表积雪独立；暂停场景时间可固定画面。这里展示局部镜头效果，空中降雪请看鸟瞰天气。
      </p>
      <p>
        这是湿雪附着的近似表现，不模拟冰晶生长或持续积雪。亮度随背景变化，不添加固定亮点高光。
      </p>
