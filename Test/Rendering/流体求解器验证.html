<!doctype html><meta charset="utf-8" /><title>流体求解器性能验证</title>
<canvas width="16" height="16"></canvas>
<pre id="result">正在测量 GPU 求解器…</pre>
<script>
  window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
</script>
<script type="module">
  import * as C from "/Build/CesiumUnminified/index.js";
  const context = new C.Context(document.querySelector("canvas"));
  const gl = context._gl,
    ext = gl.getExtension("EXT_disjoint_timer_query_webgl2");
  const debug = gl.getExtension("WEBGL_debug_renderer_info");
  const result = {
    renderer: debug
      ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
      : gl.getParameter(gl.RENDERER),
    cases: [],
  };
  let solver;
  let query;
  function cleanup() {
    if (solver && !solver.isDestroyed()) {
      solver.destroy();
    }
    if (!context.isDestroyed()) {
      if (query) {
        gl.deleteQuery(query);
      }
      context.destroy();
    }
  }
  window.addEventListener("pagehide", (event) => {
    if (!event.persisted) {
      cleanup();
    }
  });
  try {
    for (const capacity of [1024, 4096]) {
      const side = Math.ceil(Math.cbrt(capacity));
      const config = {
        maximumParticles: capacity,
        minimum: new C.Cartesian3(-1, -1, 0),
        maximum: new C.Cartesian3(1, 1, 3),
        smoothingRadius: 0.16,
        particleSpacing: 0.065,
        particleRadius: 0.025,
        gravity: new C.Cartesian3(0, 0, -9.81),
        emitterPosition: new C.Cartesian3(0, 0, 0.15),
        emitterVelocity: new C.Cartesian3(0, 0, 3),
        emitterRadius: 0.05,
        particleLifetime: 5,
        solverIterations: 2,
        restitution: 0.05,
        damping: 0,
        initialParticles: capacity,
        initialMinimum: new C.Cartesian3(-0.5, -0.5, 0.04),
        initialDimensions: new C.Cartesian3(side, side, side),
      };
      solver = new C._SceneGISFluidSolver(context, config);
      solver.step(1 / 60, 0, config);
      const samples = [];
      for (let i = 0; i < 5; i++) {
        query = ext ? gl.createQuery() : undefined;
        if (query) {
          gl.beginQuery(ext.TIME_ELAPSED_EXT, query);
        }
        const start = performance.now();
        solver.step(1 / 60, 0, config);
        const cpu = performance.now() - start;
        if (query) {
          gl.endQuery(ext.TIME_ELAPSED_EXT);
        }
        gl.flush();
        if (query) {
          while (
            !context.isDestroyed() &&
            !gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)
          ) {
            await new Promise((r) => setTimeout(r, 10));
          }
          if (context.isDestroyed()) {
            break;
          }
        }
        samples.push({
          cpu,
          gpu:
            query && !gl.getParameter(ext.GPU_DISJOINT_EXT)
              ? gl.getQueryParameter(query, gl.QUERY_RESULT) / 1e6
              : null,
        });
        if (query) {
          gl.deleteQuery(query);
        }
        query = undefined;
      }
      result.cases.push({
        capacity,
        draws: solver.drawCount,
        bytes: solver.byteLength,
        samples,
      });
      if (context.isDestroyed()) {
        break;
      }
      solver.destroy();
    }
  } finally {
    cleanup();
  }
  window.result = result;
  document.querySelector("#result").textContent = JSON.stringify(
    result,
    null,
    2,
  );
</script>
