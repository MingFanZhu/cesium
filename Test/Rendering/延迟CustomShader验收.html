<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CustomShader · 延迟与透明验收</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      aside {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 270px;
        padding: 16px;
        background: #172333ed;
        color: #edf4ff;
        font: 14px/1.55 sans-serif;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      select,
      button,
      input {
        font: inherit;
      }
      input[type="range"] {
        width: 135px;
        vertical-align: middle;
      }
      #error {
        color: #ffaaaa;
      }
      small {
        color: #b7c8dc;
      }
      #legend {
        position: absolute;
        bottom: 32px;
        right: 20px;
        padding: 12px 18px;
        background: #172333ed;
        color: #edf4ff;
        font: 14px/1.6 sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside>
      <h1>CustomShader 验收</h1>
      <p>左侧纹理模型可编辑；中间两层透明模型；右侧本地 3D Tiles。</p>
      <label
        >材质模式
        <select id="mode">
          <option value="MODIFY_MATERIAL">修改原材质</option>
          <option value="REPLACE_MATERIAL">替换原材质</option>
        </select></label
      >
      <label
        >着色方式
        <select id="lighting">
          <option value="PBR">受光 PBR</option>
          <option value="UNLIT">不受光</option>
        </select></label
      >
      <label
        >纹理配色
        <select id="texture">
          <option value="cool">蓝绿</option>
          <option value="warm">橙红</option>
        </select></label
      >
      <label
        >顶点位移
        <input id="shift" type="range" min="0" max="0.45" step="0.01" value="0"
      /></label>
      <label><input id="cutout" type="checkbox" />片元孔洞</label>
      <label
        >不透明度
        <input id="alpha" type="range" min="0" max="1" step="0.05" value="1"
      /></label>
      <label
        >主光强度
        <input id="light" type="range" min="0" max="4" step="0.1" value="2"
      /></label>
      <label><input id="occluder" type="checkbox" />前方蓝色遮挡板</label>
      <label
        ><input id="enabled" type="checkbox" checked />应用左侧
        CustomShader</label
      >
      <label><input id="hdr" type="checkbox" checked />HDR 显示</label>
      <button id="home">复位视角</button>
      <p id="picked">点击模型检查拾取；点击右侧楼栋改变该要素颜色。</p>
      <p id="stats">加载本地内容…</p>
      <small
        >左侧透明度低于 1
        时使用透明专用通道。顶点位移和孔洞会同时影响可见性与拾取。</small
      >
      <p id="error" role="alert"></p>
    </aside>
    <div id="legend">
      左：纹理与顶点修改　／　中：透明前向 + OIT　／　右：要素 CustomShader
    </div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./延迟CustomShader验收.js"></script>
  </body>
</html>
