<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>分段高斯泼溅 · SceneGIS</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <link rel="stylesheet" href="/Test/examples.css" />
  </head>
  <body>
    <div id="map"></div>
    <aside>
      <h1>分段高斯泼溅</h1>
      <p>本地合成双环，展示流式加载、视角排序和实体遮挡。</p>
      <p>
        <a href="?world=planar">平面米制</a> ·
        <a href="?world=globe">球面 ENU</a>
      </p>
      <p>
        首次使用在仓库根目录运行：<br /><code
          >node Tools/GaussianSplatTiler/examples/create-demo.js</code
        >
      </p>
      <label for="asset">分段数据地址（scene.mcl.json）</label>
      <input
        id="asset"
        style="width: 100%; box-sizing: border-box"
        value="/Build/SceneGISGaussianDemo/scene.mcl.json"
      />
      <button id="load" type="button">加载</button>
      <p id="status">正在加载…</p>
      <div id="error"></div>
    </aside>
    <div id="controls"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./分段高斯泼溅.js"></script>
  </body>
</html>
