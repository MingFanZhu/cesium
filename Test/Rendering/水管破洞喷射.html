<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>水管破洞喷射 · SceneGIS</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />

  <body>
    <div id="map"></div>
    <aside>
      <h1>水管破洞喷射</h1>
      <p>调整破口仰角观察射流落点，关闭泄漏后观察余水回落。</p>
      <p>
        点击“近看喷流”，暂停后调整“细小飞沫强度”可对比水滴细节，设为 0
        隐藏飞沫。
      </p>
      <p>
        <a href="?world=planar">平面米制</a> ·
        <a href="?world=globe">球面 ENU</a> ·
        <a href="./流体模拟喷泉.html">喷泉示例</a>
      </p>
      <p id="status">正在初始化…</p>
      <p>演示外部射流与接水过程，喷射速度由参数指定。</p>
      <div id="error"></div>
    </aside>
    <div id="controls"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./水管破洞喷射.js"></script>
