<html lang="zh-CN">

    <meta charset="utf-8" />

  <body>
    <div id="map"></div>
    <aside>
      <h1>街区上空 · 雨与雪</h1>
      <p>近远两层降水，随风飘落；结合距离雾，观察街区与城市鸟瞰的天气氛围。</p>
      <p>
        移动相机或暂停时间后旋转视角，观察雨雪的空间连续性。强度为视觉参数，街区为本地构造示意。
      </p>
      <p id="status">正在准备天气…</p>
      <p>本例侧重鸟瞰；不模拟屋檐遮雨、碰撞、地面积水或积雪。</p>

      </p>
