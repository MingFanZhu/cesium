      <h1>夜景光照</h1>
      <p>暖色路灯、冷色庭院灯、建筑聚光灯与自发光灯带。</p>
      <p>
        关闭“局部照明”可单独观察灯具自发光；关闭“自发光”可观察灯具对地面和建筑的照明。

      <p>金属展台可见局部光高光。泛光控制亮处光晕，局部灯光当前不投射阴影。</p>
