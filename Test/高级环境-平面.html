<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceneGIS 平面天空与体积云</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <link rel="stylesheet" href="/Test/AdvancedEnvironment/environment.css" />
  </head>
  <body data-scenegis-page="planar">
    <main class="sample-shell">
      <div
        id="cesiumContainer"
        class="viewer"
        aria-label="平面高级环境视图"
      ></div>
      <aside class="release-card" aria-live="polite">
        <strong>平面天空与体积云</strong>
        <span id="runtimeStatus">正在初始化本地资源……</span>
        <span>使用右侧组合对比，在同一视角下观察大气、高度雾与体积云。</span>
        <span
          >拖动底部时间轴切换时间；右侧可播放或调速。日月参考点：经纬度
          0°，时间使用 UTC。</span
        >
        <span id="errorStatus">浏览器/渲染错误：0</span>
        <a id="globeSampleLink" href="/Test/高级环境.html">返回球面高级环境</a>
      </aside>
    </main>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="/Test/AdvancedEnvironment/planar.js"></script>
  </body>
</html>
