<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceneGIS · 矢量样式图集</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      body {
        margin: 0;
        background: #f3f0e8;
        color: #283c3b;
        font:
          14px/1.6 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      header {
        padding: 20px 30px 14px;
        border-bottom: 1px solid #d6d9cf;
      }
      h1 {
        margin: 0 0 5px;
        font-size: 25px;
      }
      p {
        margin: 4px 0 10px;
        color: #61716b;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      button,
      a {
        font: inherit;
        color: #257e8b;
      }
      button {
        background: #fffdf6;
        border: 1px solid #bdcbc3;
        padding: 5px 16px;
        border-radius: 4px;
        cursor: pointer;
      }
      #stage {
        position: relative;
        height: calc(100vh - 165px);
        min-height: 760px;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      #labels {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -100%);
        font-weight: 600;
        white-space: nowrap;
        padding: 2px 8px;
        background: #f3f0e8df;
        border-radius: 3px;
      }
      #error {
        color: #a02e27;
        white-space: pre-wrap;
      }
      #picked {
        margin-left: auto;
        max-width: 470px;
      }
      #status {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>矢量样式图集</h1>
      <p>
        独立图元 · 本地 MVT · 关闭 MSAA /
        FXAA。比较透明拐角、虚线间隙和孔洞边缘，点击图形检查拾取。
      </p>
      <nav>
        <button id="top">俯视</button><button id="tilt">倾斜</button
        ><button id="recreate">重建图层</button>
        <a href="./index.html">返回矢量城市</a><span id="status">加载中…</span
        ><span id="picked">尚未选择要素</span>
      </nav>
      <div id="error" role="alert"></div>
    </header>
    <div id="stage">
      <div id="map"></div>
      <div id="labels"></div>
    </div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./styles.js"></script>
  </body>
</html>
