<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceneGIS · 点标注</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      body {
        margin: 0;
        color: #243c40;
        background: #eef2ed;
        font:
          14px/1.6 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      header {
        padding: 16px 28px;
        border-bottom: 1px solid #c8d6cf;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        margin: 4px 0 10px;
        color: #58716c;
      }
      nav {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      a {
        font: inherit;
        color: #217b87;
      }
      button {
        cursor: pointer;
        padding: 4px 15px;
        border: 1px solid #b9cbc5;
        background: white;
        border-radius: 4px;
      }
      #map {
        height: calc(100vh - 150px);
        min-height: 580px;
      }
      #error {
        color: #b43530;
      }
      #picked {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>独立点标注</h1>
      <p>
        中英文横排与描边、图文组合、排序避让。左下重叠的两条标注只显示优先项；点击文字或图标检查拾取。
      </p>
      <nav>
        <button id="top">俯视</button><button id="tilt">倾斜</button
        ><button id="zoom">连续缩放</button
        ><button id="recreate">重建图层</button>
        <a href="./public.html">公开地图</a><a href="./styles.html">样式图集</a
        ><span id="status">加载中…</span><span id="picked">尚未选择要素</span>
      </nav>
      <div id="error" role="alert"></div>
    </header>
    <div id="map"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./symbols.js"></script>
  </body>
</html>
