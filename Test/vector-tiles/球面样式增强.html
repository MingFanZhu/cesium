<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>球面 · 样式增强</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      aside {
        position: absolute;
        top: 12px;
        left: 12px;
        background: #fffffff0;
        padding: 16px;
        font: 14px sans-serif;
        max-width: 300px;
        z-index: 1;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside>
      <strong>球面 · 样式增强</strong>
      <p>
        本地确定性
        MVT：水面、道路、背景和楼栋使用不同的重复纹理。保留原生地球，可缩放、倾斜及点击选中要素：道路加宽、楼栋增高、水面高亮。
      </p>
      <p>红点处的三个 POI 使用可变锚点自动避让。</p>
      <p id="status">点击地图查看拾取结果</p>
    </aside>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module">
      import start from "./style-enhancements.js";
      start(true);
    </script>
  </body>
</html>
