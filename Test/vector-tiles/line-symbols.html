<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceneGIS · 沿线与特殊标注</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      body {
        margin: 0;
        color: #243c40;
        background: #f4f2e9;
        font:
          14px/1.6 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      header {
        padding: 14px 24px;
        border-bottom: 1px solid #d9d9ce;
      }
      h1 {
        margin: 0;
        font-size: 23px;
      }
      p {
        margin: 3px 0 10px;
        color: #65736d;
      }
      nav {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      a {
        font: inherit;
        color: #217b87;
      }
      button {
        cursor: pointer;
        padding: 3px 12px;
        border: 1px solid #b9cbc5;
        background: white;
        border-radius: 4px;
      }
      #map {
        height: calc(100vh - 146px);
        min-height: 580px;
      }
      #error {
        color: #b43530;
      }
      #picked {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>沿线文字 · 路牌 · 方向箭头</h1>
      <p>
        道路名称逐字沿曲线排布，反向道路保持正向阅读；绿色路牌朝向屏幕。底部锐角与短线应不显示名称。点击字形或图标检查拾取。
      </p>
      <nav>
        <button id="top">俯视</button><button id="tilt">倾斜</button
        ><button id="rotate">旋转 180°</button>
        <button id="zoom">连续缩放</button
        ><button id="recreate">重建图层</button>
        <a href="./public.html">公开地图</a><a href="./symbols.html">点标注</a>
        <span id="status">加载中…</span><span id="picked">尚未选择要素</span>
      </nav>
      <div id="error" role="alert"></div>
    </header>
    <div id="map"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module" src="./line-symbols.js"></script>
  </body>
</html>
