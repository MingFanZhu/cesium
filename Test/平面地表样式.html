<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1"
    />
    <title>SceneGIS 平面地表样式</title>
    <link rel="stylesheet" href="/Build/CesiumUnminified/Widgets/widgets.css" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body > .lil-gui.lil-root {
        position: absolute !important;
        z-index: 10 !important;
        top: 10px !important;
        right: 10px !important;
        max-width: calc(100% - 20px) !important;
        max-height: calc(100% - 76px) !important;
        overflow: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <script>
      window.CESIUM_BASE_URL = "/Build/CesiumUnminified/";
    </script>
    <script type="module">
      import * as Cesium from "/Build/CesiumUnminified/index.js";
      import GUI from "/Test/lib/lil-gui/lil-gui.esm.min.js";

      const LIMIT = 20037508.342789244;
      const MOUNTAIN = new Cesium.Cartesian3(1113194.9, 5780349.2, 0.0);
      const defaults = Object.freeze({
        brightness: 1.0,
        contrast: 1.0,
        hue: 0.0,
        saturation: 1.0,
        gamma: 1.0,
        colorToAlphaEnabled: false,
        colorToAlpha: "#ffffff",
        colorToAlphaThreshold: 0.004,
        terrainStyle: "none",
        contourSpacing: 250.0,
        contourWidth: 1.5,
        contourColor: "#ffff00",
        rampLowColor: "#263238",
        rampHighColor: "#ffffff",
        terrainLighting: true,
      });
      const state = {
        ...defaults,
        providerStatus: "公开影像与地形正在加载（best-effort）……",
        resetFilters: () => resetFilters(),
        resetTerrainStyle: () => resetTerrainStyle(),
        mountainView: () => viewMountain(),
        planarHome: () => {
          viewer.planarCameraController.viewHome(viewer.scene);
          viewer.scene.requestRender();
        },
        help: "影像滤镜先合成，terrain Material随后合成，地形光照最后执行。",
      };
      const providerState = { imageryFailed: false, terrainFailed: false };
      let viewer = new Cesium.Viewer("cesiumContainer", {
        planarWorld: {
          extent: {
            minimumX: -LIMIT,
            minimumY: -LIMIT,
            maximumX: LIMIT,
            maximumY: LIMIT,
          },
          crs: "EPSG:3857",
          maximumLevel: 16,
          baseColor: Cesium.Color.fromCssColorString("#263238"),
          enableLighting: true,
        },
        skyBox: false,
        skyAtmosphere: false,
        animation: false,
        timeline: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
        baseLayerPicker: false,
        geocoder: false,
        sceneModePicker: false,
        projectionPicker: false,
        navigationHelpButton: false,
        vrButton: false,
      });
      const world = viewer.planarWorld;
      viewer.scene.rethrowRenderErrors = true;

      function viewMountain() {
        viewer.camera.setView({
          destination: new Cesium.Cartesian3(
            MOUNTAIN.x,
            MOUNTAIN.y - 400000.0,
            300000.0,
          ),
          orientation: {
            direction: new Cesium.Cartesian3(0.0, 0.8, -0.6),
            up: new Cesium.Cartesian3(0.0, 0.6, 0.8),
          },
        });
        viewer.scene.requestRender();
      }

      const imageryProvider =
        new Cesium.SceneGISPlanarUrlTemplateImageryProvider({
          url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          tilingScheme: world.tilingScheme,
          urlScheme: "xyz",
          tileWidth: 256,
          tileHeight: 256,
          maximumLevel: 16,
          credit: new Cesium.Credit(
            '<a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a>',
            true,
          ),
        });
      const imageryLayer =
        world.imageryLayers.addImageryProvider(imageryProvider);
      const terrainProvider =
        new Cesium.SceneGISPlanarUrlTemplateHeightmapTerrainProvider({
          url: "https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer/tile/{z}/{y}/{x}",
          tilingScheme: world.tilingScheme,
          urlScheme: "xyz",
          heightmapWidth: 257,
          heightmapHeight: 257,
          format: "lerc",
          minimumHeight: -450.0,
          maximumHeight: 8700.0,
          maximumLevel: 16,
          credit: new Cesium.Credit(
            '<a href="https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer" target="_blank">World Elevation services by Esri and listed contributors</a>',
            true,
          ),
        });
      world.terrainProvider = terrainProvider;

      const defaultRamps = Object.freeze({
        height: [
          [0.0, "#263238"],
          [0.35, "#2e7d32"],
          [0.7, "#f9a825"],
          [1.0, "#ffffff"],
        ],
        slope: [
          [0.0, "#1b5e20"],
          [0.5, "#fdd835"],
          [1.0, "#b71c1c"],
        ],
        aspect: [
          [0.0, "#ef5350"],
          [0.25, "#ffee58"],
          [0.5, "#66bb6a"],
          [0.75, "#42a5f5"],
          [1.0, "#ef5350"],
        ],
      });
      function cloneStops(stops) {
        return stops.map(([offset, color]) => [offset, color]);
      }
      const rampStops = {
        height: cloneStops(defaultRamps.height),
        slope: cloneStops(defaultRamps.slope),
        aspect: cloneStops(defaultRamps.aspect),
      };
      function createRamp(stops) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 1;
        const context = canvas.getContext("2d");
        const gradient = context.createLinearGradient(0, 0, 256, 0);
        for (const [offset, color] of stops) {
          gradient.addColorStop(offset, color);
        }
        context.fillStyle = gradient;
        context.fillRect(0, 0, 256, 1);
        return canvas;
      }
      const materials = {
        contour: Cesium.Material.fromType(
          Cesium.Material.ElevationContourType,
          {
            spacing: defaults.contourSpacing,
            width: defaults.contourWidth,
            color: Cesium.Color.fromCssColorString(defaults.contourColor),
          },
        ),
        height: Cesium.Material.fromType(Cesium.Material.ElevationRampType, {
          image: createRamp(rampStops.height),
          minimumHeight: -450.0,
          maximumHeight: 8700.0,
        }),
        slope: Cesium.Material.fromType(Cesium.Material.SlopeRampMaterialType, {
          image: createRamp(rampStops.slope),
        }),
        aspect: Cesium.Material.fromType(
          Cesium.Material.AspectRampMaterialType,
          { image: createRamp(rampStops.aspect) },
        ),
      };

      function applyFilter(property, value) {
        imageryLayer[property] = value;
        viewer.scene.requestRender();
      }
      function updateColorToAlpha() {
        imageryLayer.colorToAlpha = state.colorToAlphaEnabled
          ? Cesium.Color.fromCssColorString(state.colorToAlpha)
          : undefined;
        viewer.scene.requestRender();
      }
      function setTerrainStyle(value) {
        state.terrainStyle = value;
        world.material = value === "none" ? undefined : materials[value];
        if (["height", "slope", "aspect"].includes(value)) {
          const stops = rampStops[value];
          state.rampLowColor = stops[0][1];
          state.rampHighColor = stops[stops.length - 1][1];
          gui.controllersRecursive().forEach((controller) => {
            if (
              controller.property === "rampLowColor" ||
              controller.property === "rampHighColor"
            ) {
              controller.updateDisplay();
            }
          });
        }
        viewer.scene.requestRender();
      }
      function updateContour() {
        materials.contour.uniforms.spacing = state.contourSpacing;
        materials.contour.uniforms.width = state.contourWidth;
        materials.contour.uniforms.color = Cesium.Color.fromCssColorString(
          state.contourColor,
        );
        setTerrainStyle("contour");
      }
      function updateRamp() {
        if (!["height", "slope", "aspect"].includes(state.terrainStyle)) {
          return;
        }
        const stops = rampStops[state.terrainStyle];
        stops[0][1] = state.rampLowColor;
        stops[stops.length - 1][1] = state.rampHighColor;
        materials[state.terrainStyle].uniforms.image = createRamp(stops);
        viewer.scene.requestRender();
      }
      function resetFilters() {
        for (const property of [
          "brightness",
          "contrast",
          "hue",
          "saturation",
          "gamma",
          "colorToAlphaThreshold",
        ]) {
          state[property] = defaults[property];
          imageryLayer[property] = defaults[property];
        }
        state.colorToAlphaEnabled = false;
        state.colorToAlpha = defaults.colorToAlpha;
        imageryLayer.colorToAlpha = undefined;
        gui
          .controllersRecursive()
          .forEach((controller) => controller.updateDisplay());
        viewer.scene.requestRender();
      }
      function resetTerrainStyle() {
        Object.assign(state, {
          terrainStyle: defaults.terrainStyle,
          contourSpacing: defaults.contourSpacing,
          contourWidth: defaults.contourWidth,
          contourColor: defaults.contourColor,
          rampLowColor: defaultRamps.height[0][1],
          rampHighColor: defaultRamps.height[defaultRamps.height.length - 1][1],
        });
        materials.contour.uniforms.spacing = defaults.contourSpacing;
        materials.contour.uniforms.width = defaults.contourWidth;
        materials.contour.uniforms.color = Cesium.Color.fromCssColorString(
          defaults.contourColor,
        );
        for (const style of ["height", "slope", "aspect"]) {
          rampStops[style] = cloneStops(defaultRamps[style]);
          materials[style].uniforms.image = createRamp(rampStops[style]);
        }
        world.material = undefined;
        gui
          .controllersRecursive()
          .forEach((controller) => controller.updateDisplay());
        viewer.scene.requestRender();
      }
      function updateProviderStatus() {
        const failures = [];
        if (providerState.imageryFailed) {
          failures.push("影像不可用，使用baseColor");
        }
        if (providerState.terrainFailed) {
          failures.push("地形不可用，使用flat fallback");
        }
        state.providerStatus =
          failures.length > 0
            ? failures.join("；")
            : world.tilesLoaded
              ? "当前视图公开数据已就绪"
              : "公开影像与地形正在加载（best-effort）……";
      }
      imageryProvider.errorEvent.addEventListener((error) => {
        providerState.imageryFailed = true;
        error.retry = false;
        updateProviderStatus();
      });
      terrainProvider.errorEvent.addEventListener((error) => {
        providerState.terrainFailed = true;
        error.retry = false;
        updateProviderStatus();
      });
      const removePostRender =
        viewer.scene.postRender.addEventListener(updateProviderStatus);

      const gui = new GUI({ title: "平面地表样式", width: 360 });
      const imageryFolder = gui.addFolder("影像颜色滤镜");
      for (const [property, label, minimum, maximum, step] of [
        ["brightness", "亮度", 0.0, 3.0, 0.01],
        ["contrast", "对比度", 0.0, 3.0, 0.01],
        ["hue", "色相（弧度）", -Math.PI, Math.PI, 0.01],
        ["saturation", "饱和度", 0.0, 3.0, 0.01],
        ["gamma", "Gamma", 0.1, 3.0, 0.01],
      ]) {
        imageryFolder
          .add(state, property, minimum, maximum, step)
          .name(label)
          .onChange((value) => applyFilter(property, value));
      }
      imageryFolder
        .add(state, "colorToAlphaEnabled")
        .name("启用颜色透明")
        .onChange(updateColorToAlpha);
      imageryFolder
        .addColor(state, "colorToAlpha")
        .name("透明目标颜色")
        .onChange(updateColorToAlpha);
      imageryFolder
        .add(state, "colorToAlphaThreshold", 0.0, 1.0, 0.001)
        .name("颜色阈值")
        .onChange((value) => applyFilter("colorToAlphaThreshold", value));
      imageryFolder.add(state, "resetFilters").name("重置影像滤镜");

      const terrainFolder = gui.addFolder("地形 Material 样式");
      terrainFolder
        .add(state, "terrainStyle", {
          无样式: "none",
          等高线: "contour",
          高程色带: "height",
          坡度色带: "slope",
          坡向色带: "aspect",
        })
        .name("样式")
        .onChange(setTerrainStyle);
      terrainFolder
        .add(state, "contourSpacing", 10.0, 2000.0, 10.0)
        .name("等高距（米）")
        .onChange(updateContour);
      terrainFolder
        .add(state, "contourWidth", 0.1, 8.0, 0.1)
        .name("线宽")
        .onChange(updateContour);
      terrainFolder
        .addColor(state, "contourColor")
        .name("等高线颜色")
        .onChange(updateContour);
      terrainFolder
        .addColor(state, "rampLowColor")
        .name("色带低值")
        .onChange(updateRamp);
      terrainFolder
        .addColor(state, "rampHighColor")
        .name("色带高值")
        .onChange(updateRamp);
      terrainFolder.add(state, "resetTerrainStyle").name("重置地形样式");

      gui
        .add(state, "terrainLighting")
        .name("地形光照")
        .onChange((value) => {
          world.enableLighting = value;
          viewer.scene.requestRender();
        });
      gui.add(state, "mountainView").name("山地区域");
      gui.add(state, "planarHome").name("平面全域 Home");
      gui.add(state, "help").name("合成顺序").disable();
      gui.add(state, "providerStatus").name("公开数据").listen().disable();

      viewMountain();
      updateProviderStatus();
      window.viewer = viewer;
      window.world = world;
      window.imageryLayer = imageryLayer;
      window.terrainMaterials = materials;
      window.terrainRampStops = rampStops;
      window.gui = gui;
      window.exampleKind = "planar-surface-styling";

      let disposed = false;
      function dispose() {
        if (disposed) {
          return;
        }
        disposed = true;
        removePostRender();
        world.material = undefined;
        for (const material of Object.values(materials)) {
          if (!material.isDestroyed()) {
            material.destroy();
          }
        }
        gui.destroy();
        if (!viewer.isDestroyed()) {
          viewer = viewer.destroy();
        }
        window.viewer = undefined;
        window.world = undefined;
        window.imageryLayer = undefined;
        window.terrainMaterials = undefined;
        window.terrainRampStops = undefined;
        window.gui = undefined;
        window.exampleKind = undefined;
      }
      window.addEventListener("pagehide", (event) => {
        if (!event.persisted) {
          dispose();
        }
      });
    </script>
  </body>
</html>
